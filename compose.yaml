services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: screenhabit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: screenhabit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenhabit"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://screenhabit:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/screenhabit
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
